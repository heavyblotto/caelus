# Vale configuration for the prose lints.
#
# This gates *documentation and product copy*. The corpus itself is not linted
# here: its 3,096 essays are gated by `src/lint.ts`, which knows about cell
# families, length bands, and duplication across a family. Two different jobs,
# two different tools.
#
# Repointing this for a new project: the two `[.*-prose-extract.md]` sections
# grade whatever `editorial/scripts/extract-web-prose.mjs` writes, so they
# follow the extractor rather than any particular app layout. Add sections for
# your own docs paths as you create them.

StylesPath = editorial/styles

MinAlertLevel = warning

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.6.1/ai-tells.zip

Vocab = Caelus

[*.md]
BasedOnStyles = Vale, ai-tells, Caelus
ai-tells.EmDashUsage = suggestion
# Don't enforce term casing on tokens inside URLs / bare hostnames.
TokenIgnores = (https?://\S+), (([a-z0-9-]+\.)+(com|org|io|net|dev|sh|ai)\S*)

# Developer-facing copy — slop rules, not spelling (code-adjacent terms).
# These pages legitimately name the engine's own types, so the
# insider-vocabulary gate is off here and on for the consumer extract below.
[.web-prose-extract.md]
BasedOnStyles = Vale, ai-tells, Caelus, web
Vale.Spelling = NO
Vale.Terms = NO
ai-tells.FormalRegister = NO
ai-tells.VerbTricolon = suggestion
ai-tells.ContrastiveFormulas = warning
web.InsiderVocabulary = NO

# Consumer product copy — the product-copy register, fully enforced,
# including the insider-vocabulary gate (editorial/editorial-voice.md).
[.free-prose-extract.md]
BasedOnStyles = Vale, ai-tells, Caelus, web
Vale.Spelling = NO
Vale.Terms = NO
ai-tells.FormalRegister = NO
ai-tells.VerbTricolon = suggestion
ai-tells.ContrastiveFormulas = warning

# The style guides list banned phrases as examples, so they would fail
# themselves under the slop rules. Spelling only.
[editorial/{editorial-voice,ai-slop-style-sheet}.md]
BasedOnStyles = Vale
Vale.Terms = NO

# The writing and review sheets quote banned phrasings as specimens, for the
# same reason. They are instructions to writers, not shipped prose.
[pipeline/*.md]
BasedOnStyles = Vale
Vale.Terms = NO
Vale.Spelling = NO
