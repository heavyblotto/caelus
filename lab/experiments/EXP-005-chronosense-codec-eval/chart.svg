  <text x="338.5" y="402" text-anchor="middle" font-size="11" fill="#444444">25%</text>
  <text x="441.0" y="402" text-anchor="middle" font-size="11" fill="#444444">50%</text>
  <text x="543.5" y="402" text-anchor="middle" font-size="11" fill="#444444">75%</text>
  <text x="646" y="402" text-anchor="middle" font-size="11" fill="#444444">100%</text>
  <text x="380" y="420" text-anchor="middle" font-size="11" fill="#444444">Mean accuracy across 20 EXP-001 tasks (circles = gemma4:12b, diamonds = qwen3.5:9b, ticks = offline ceiling)</text>
