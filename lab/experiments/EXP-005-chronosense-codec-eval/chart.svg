  <text x="224" y="221" text-anchor="end" font-size="12.5" fill="#222222">Control-Synthetic</text>
  <text x="224" y="235" text-anchor="end" font-size="10.5" fill="#666666">26.0 tok, elapsed + fixed 24h sin/cos</text>
