  <text x="224" y="123" text-anchor="end" font-size="10.5" fill="#666666">45.8 tok, 0 hops, 5-class twilight</text>
  <line x1="236" y1="112" x2="646" y2="112" stroke="#efefef" stroke-width="1"/>
  <line x1="545.2" y1="112" x2="564.0" y2="112" stroke="#555555" stroke-width="1.8"/>
