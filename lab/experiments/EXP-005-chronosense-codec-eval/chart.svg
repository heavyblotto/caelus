  <polygon points="369.3,330.8 374.5,336 369.3,341.2 364.1,336" fill="#9e4228"/>
  <text x="660" y="340" text-anchor="start" font-size="12" fill="#222222">30.6%</text>
  <text x="660" y="353" text-anchor="start" font-size="10" fill="#666666">-47.1 pp vs Phys</text>

  <!-- Range-frame horizontal axis (0% to 100%) -->
  <line x1="236" y1="384" x2="646" y2="384" stroke="#333333" stroke-width="1"/>
  <line x1="236" y1="384" x2="236" y2="389" stroke="#333333" stroke-width="1"/>
  <line x1="338.5" y1="384" x2="338.5" y2="389" stroke="#333333" stroke-width="1"/>
