  <text x="224" y="277" text-anchor="end" font-size="12.5" fill="#222222">Control-ISO</text>
  <text x="224" y="291" text-anchor="end" font-size="10.5" fill="#666666">15.0 tok, passive UTC ISO-8601</text>
