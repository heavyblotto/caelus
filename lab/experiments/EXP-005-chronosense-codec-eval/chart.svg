<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="et-book, ET-Bembo, Palatino, Georgia, serif" font-size="13">
  <rect width="760" height="430" fill="#ffffff"/>

  <text x="32" y="30" font-size="16.5" fill="#111111">EXP-005: Live 5-Arm Chronosense Codec Showdown (20 Tasks x 2 Models)</text>
  <text x="32" y="49" font-size="11.5" fill="#555555">Composite accuracy (%) across compaction stale-tool and high-latitude photoperiod slices (temperature = 0)</text>

  <!-- Subtle Razor +20 pp threshold reference over Control-ISO macro (40.8% + 20 pp = 60.8% -> x = 485.4) -->
  <line x1="403.4" y1="92" x2="403.4" y2="356" stroke="#dddddd" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="485.4" y1="92" x2="485.4" y2="356" stroke="#c8d6dc" stroke-width="1" stroke-dasharray="3,3"/>
