  <text x="485.4" y="370" text-anchor="middle" font-size="10" fill="#1b5e7a">Razor +20 pp (60.8%)</text>

  <!-- Direct mark labels above top row (no separate legend box, staggered y-lanes for zero overlap) -->
  <text x="564" y="69" text-anchor="middle" font-size="11" fill="#9e4228">qwen3.5:9b</text>
  <line x1="564" y1="73" x2="564" y2="104" stroke="#9e4228" stroke-width="0.8"/>
